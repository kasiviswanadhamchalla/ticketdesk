server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: ticketdesk-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticketdesk}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:dbadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:dbadmin}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

aws:
  s3:
    bucket-name: ${AWS_S3_ATTACHMENT_BUCKET:ticketdesk-attachments}
    region: ${AWS_REGION:us-east-1}
    presigned-url-expiration-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized
