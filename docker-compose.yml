services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketdesk-postgres
    restart: always
    environment:
      POSTGRES_DB: ticketdesk_db
      POSTGRES_USER: ticketdesk_user
      POSTGRES_PASSWORD: SecurePassword123!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketdesk_user -d ticketdesk_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketdesk-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticketdesk-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketdesk_db
      SPRING_DATASOURCE_USERNAME: ticketdesk_user
      SPRING_DATASOURCE_PASSWORD: SecurePassword123!
      JWT_SECRET: 9a4f2c8d7e1b5a3c9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a
      AWS_REGION: us-east-1
      AWS_S3_ATTACHMENT_BUCKET: ticketdesk-attachments-production
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticketdesk-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticketdesk-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ticketdesk-net

networks:
  ticketdesk-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
