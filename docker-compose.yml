services:
  mysql:
    image: mysql:8.0
    container_name: ticketdesk-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ticketdesk_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketdesk-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticketdesk-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ticketdesk_db
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketdesk_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: 9a4f2c8d7e1b5a3c9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a
      AWS_REGION: us-east-1
      AWS_S3_ATTACHMENT_BUCKET: ticketdesk-attachments-production
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ticketdesk-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticketdesk-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ticketdesk-net

networks:
  ticketdesk-net:
    driver: bridge

volumes:
  mysqldata:
    driver: local
