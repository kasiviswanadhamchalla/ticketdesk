name: TicketDesk CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tkt-kc-dev-backend
  ECS_SERVICE: tkt-kc-dev-backend-service
  ECS_CLUSTER: tkt-kc-dev-cluster
  CONTAINER_NAME: ticketdesk-backend
  S3_FRONTEND_BUCKET: tkt-kc-dev-web-6953e5ec

jobs:
  validate-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Backend Maven Tests
        run: |
          if [ -d "backend" ]; then
            cd backend && ./mvnw test -B || true
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: cd infrastructure/terraform && terraform fmt -check -recursive

      - name: Terraform Init & Validate
        run: cd infrastructure/terraform && terraform init -backend=false && terraform validate

  deploy-frontend:
    name: Build & Deploy Frontend to AWS S3
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build & Sync Frontend to S3
        env:
          VITE_API_BASE_URL: http://tkt-kc-dev-alb-1737711098.us-east-1.elb.amazonaws.com/api
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm ci
            npm run build
            aws s3 sync dist/ s3://${{ env.S3_FRONTEND_BUCKET }} --delete
          fi

  deploy-backend:
    name: Build Docker Image & Deploy to AWS ECS
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Building Docker image: $IMAGE_URI"
          if [ -d "backend" ]; then
            docker build -t "$IMAGE_URI" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" backend/
            docker push "$IMAGE_URI"
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
            echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Amazon ECS Fargate
        if: steps.build-image.outputs.image != ''
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --force-new-deployment
